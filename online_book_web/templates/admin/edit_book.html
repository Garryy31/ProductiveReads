{% extends 'base.html' %}{% block title %}Edit book | ProductiveReads{% endblock %}{% block content %}<section class="simple-page"><p class="eyebrow">CATALOG MANAGEMENT</p><h1>Edit this<br><em>book.</em></h1><form method="post" enctype="multipart/form-data" class="admin-form book-form"><input name="title" value="{{ book.title }}" required><input name="author" value="{{ book.author }}" required><textarea name="description" required>{{ book.description }}</textarea><input name="takeaways" value="{{ book.takeaways }}" required><select name="category_id">{% for category in categories %}<option value="{{ category.id }}" {% if category.id == book.category_id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select><input name="price" type="number" step="1" value="{{ book.price }}" required><input name="original_price" type="number" step="1" value="{{ book.original_price }}" required><input name="rating" type="number" step="0.1" min="0" max="5" value="{{ book.rating }}"><input name="stock" type="number" min="0" value="{{ book.stock }}" required><input name="cover_color" value="{{ book.cover_color }}"><div class="current-cover"><strong>Current Cover</strong><img class="admin-current-cover" src="{% if book.image %}{{ url_for('static', filename='uploads/books/' ~ book.image) }}{% else %}{{ url_for('static', filename='images/book-placeholder.svg') }}{% endif %}" onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/book-placeholder.svg') }}';" alt="Current {{ book.title }} cover"><span>{% if book.image %}Uploaded cover{% else %}No Image Available{% endif %}</span></div><label class="upload-box" for="edit-book-image"><strong>Upload New Cover</strong><span>JPG, JPEG, PNG, or WEBP · maximum 5 MB</span><input id="edit-book-image" name="image" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" data-image-preview="#edit-book-preview"></label><img id="edit-book-preview" class="admin-image-preview" src="{{ url_for('static', filename='images/book-placeholder.svg') }}" alt="New selected cover preview"><button class="solid-button" type="submit">Save changes</button></form></section><script src="{{ url_for('static', filename='js/image-preview.js') }}"></script>{% endblock %}
