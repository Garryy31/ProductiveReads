{% extends 'base.html' %}{% block title %}Orders | ProductiveReads{% endblock %}{% block content %}<section class="simple-page"><p class="eyebrow">ORDERS</p><h1>Every order<br><em>matters.</em></h1><form method="get" class="admin-search"><input name="q" value="{{ search }}" placeholder="Search order, customer, email"><button class="outline-button" type="submit">Search</button></form><div class="admin-table">{% for order in orders %}<div><span><a href="{{ url_for('admin.order_detail', order_id=order.id) }}">#{{ order.id }}</a> · {{ order.customer_name }} · ₹{{ '%.0f'|format(order.total_amount) }}</span><span class="admin-actions"><strong>{{ order.payment_status }}</strong><form method="post"><input type="hidden" name="order_id" value="{{ order.id }}"><select name="payment_status"><option value="PENDING">Pending</option><option value="FAILED">Failed</option><option value="CANCELLED">Cancelled</option></select><button class="outline-button" type="submit">Update</button></form></span></div>{% endfor %}</div></section>{% endblock %}
