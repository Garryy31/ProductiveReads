<article class="book-card"><a href="{{ url_for('books.detail', book_id=book.id) }}"><div class="cover image-cover" style="--cover: {{ book.cover_color }}"><img src="{% if book.image %}{{ url_for('static', filename='uploads/books/' ~ book.image) }}{% else %}{{ url_for('static', filename='images/book-placeholder.svg') }}{% endif %}" onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/book-placeholder.svg') }}';" alt="{{ book.title }} book cover"><span class="cover-category">{{ book.category_name }}</span></div><div class="book-meta"><p class="book-category">{{ book.category_name }} <span>·</span> ★ {{ book.rating }}</p><h3>{{ book.title }}</h3><p class="author">{{ book.author }}</p><div class="price"><strong>₹{{ '%.0f'|format(book.price) }}</strong> <del>₹{{ '%.0f'|format(book.original_price) }}</del><span>{{ ((1 - book.price / book.original_price) * 100)|round|int }}% off</span></div></div></a></article>
