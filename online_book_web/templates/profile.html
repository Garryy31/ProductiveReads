{% extends 'base.html' %}{% block title %}Profile | ProductiveReads{% endblock %}{% block content %}<section class="simple-page profile-page"><p class="eyebrow">YOUR READING LIFE</p><h1>Hello, <em>{{ user.name.split(' ')[0] }}.</em></h1><div class="profile-card"><p class="eyebrow">ACCOUNT DETAILS</p><div><span>Name</span><strong>{{ user.name }}</strong></div><div><span>Email</span><strong>{{ user.email }}</strong></div><div><span>Member since</span><strong>{{ user.created_at[:10] }}</strong></div></div><div class="profile-links"><a class="outline-button" href="{{ url_for('cart.wishlist') }}">View wishlist</a><a class="solid-button" href="{{ url_for('cart.view_cart') }}">View cart</a></div></section>{% endblock %}
